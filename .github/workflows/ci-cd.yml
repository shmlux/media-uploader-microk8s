name: CI-CD Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Cache pip dependencies to make future runs lightning fast
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Force the runner to use the small CPU-only PyTorch wheels
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://pytorch.org
        pip install -r requirements.txt

    - name: Test Docker Build
      run: |
        docker build -t media-uploader:test .

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Flask==3.0.2 werkzeug==3.0.1 Pillow==10.2.0
        pip install torch==2.2.0 torchvision==0.17.0 --index-url https://pytorch.org
